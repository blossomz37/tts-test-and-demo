<!doctype html>
<html lang="en" class="no-texture">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; media-src 'self' blob:; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<title>Listen &amp; take notes</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header"><h1>Listen &amp; take notes</h1><button id="export-comments">Export sidecar</button></header>
<main>
<section class="panel reading" aria-labelledby="reading-heading">
  <div class="heading"><h2 id="reading-heading">Text to speech</h2><span class="voice">Heart</span></div>
  <p id="passage" class="passage" tabindex="0" aria-describedby="selection-hint"></p>
  <p id="selection-hint" class="hint">Select text to add a comment. Purple underlines mark saved comments.</p>
  <div class="controls"><button id="play" class="primary" disabled>Play</button><button id="stop" disabled>Stop</button><button id="comment-selection" disabled>Comment on selection</button><span id="play-status" role="status" aria-live="polite"></span></div>
</section>
<section class="panel notes" aria-labelledby="notes-heading">
  <div id="general-notes"><div class="heading"><h2 id="notes-heading">Speech to text</h2><button id="dictate" class="dictate" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg><span id="dictate-label">Dictate</span></button></div>
  <label class="sr-only" for="notes">Notes</label>
  <textarea id="notes" placeholder="Type your notes, or click Dictate…" spellcheck="true"></textarea>
  <p id="interim" class="interim" aria-live="off"></p>
  <p id="dictation-status" class="status" role="status" aria-live="polite">Type or dictate. Notes are saved on this device.</p>

</div>
</section>
<aside id="comment-inspector" class="panel inspector" aria-label="Comments inspector" hidden>
  <div id="comment-composer" hidden>
    <div class="heading"><h2 id="comment-heading">Comment on selection</h2><button id="comment-dictate" aria-pressed="false">Dictate comment</button></div>
    <blockquote id="comment-quote"></blockquote>
    <label class="sr-only" for="comment-body">Comment</label>
    <textarea id="comment-body" placeholder="Type or dictate your comment…"></textarea>
    <p id="comment-interim" class="interim"></p>
    <div class="controls"><button id="save-comment" class="primary">Save comment</button><button id="cancel-comment">Back to notes</button></div>
    <p id="comment-status" class="status" role="status"></p>
  </div>
  <div id="sidecar" hidden><div class="heading"><h2>Comments</h2><p id="sidecar-status" class="status notice" role="status" aria-live="polite"></p></div><div id="comment-list"></div></div>
</aside>
</main>
<script type="module" src="src/app.mjs"></script>
</body></html>
